<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Wanderly Travel</title>
</head>

<body>

    <header>

        <div class="container">
            <h1 class="logo">
                <span>Wanderly</span>
            </h1>

            <nav>
                <div class="menu-icon">&#9776;</div>

                <ul class="nav-list">
                    <li>Home</li>
                    <li>About</li>
                    <li>Tour</li>
                    <li>Hotels</li>
                    <li>Services</li>
                    <li>Blog</li>
                    <li>Contact</li>
                </ul>
            </nav>
        </div>


        <div class="hero-section">

            <div class="content_wrapper">
                <h1>Discover The Extraordinary</h1>
                <p>Curated Journey For The Sophisticated Explorer</p>
            </div>


            <form action="">

                <div class="search-item">
                    <div>Destination</div>
                    <input type="text" placeholder="Ex: Hotels, Tour...">
                </div>

                <div class="search-item">
                    <div>Trip Type</div>
                    <input type="text" placeholder="Select type">
                </div>

                <div class="search-item">
                    <div>Date</div>
                    <input type="date">
                </div>

                <div class="search-item">
                    <div>Guests</div>
                    <input type="text" placeholder="Add guests">
                </div>

                <div class="search-item">
                    <button class="search_btn" type="submit">
                        Search
                    </button>
                </div>

            </form>

        </div>

    </header>

</body>
</html>
